[project]
name = "charms-seed-echo"
version = "0.1.0"
description = "Echo seed — dependency-free dispatch demo"
requires-python = ">=3.12"
# charms-core is provided by the charms-launcher runtime — packaged seeds
# never list it as a dependency.
dependencies = []

[project.entry-points."charms.seeds"]
echo = "charms_seed_echo:EchoSeed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charms_seed_echo"]
