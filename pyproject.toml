# Virtual workspace root. charms-core (the wire/SDK contracts shared with
# the server) comes from PyPI — the launcher pins the exact version matching
# the server protocol; releases are cut from the charms monorepo.

[tool.uv.workspace]
members = ["launcher", "examples/seeds/*"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
src = ["launcher/src", "examples/seeds/echo/src", "examples/seeds/echo_stream/src"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

# Optional heavy dependencies, lazy-imported behind try/except.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "huggingface_hub"]
ignore_missing_imports = true
