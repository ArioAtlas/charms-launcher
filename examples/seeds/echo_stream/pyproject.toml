[project]
name = "charms-seed-echo-stream"
version = "0.2.0"
description = "Streaming echo seed — dependency-free realtime demo"
requires-python = ">=3.12"
# charms-core is provided by the charms-launcher runtime — packaged seeds
# never list it as a dependency.
dependencies = []

[project.entry-points."charms.seeds"]
echo_stream = "charms_seed_echo_stream:EchoStreamSeed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charms_seed_echo_stream"]
