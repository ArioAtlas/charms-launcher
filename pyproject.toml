# Virtual workspace root. `core/` is a vendored copy of the charms monorepo's
# charms-core (the wire/SDK contracts shared with the server) — keep it
# byte-identical and sync it when the monorepo's core changes.

[tool.uv.workspace]
members = ["core", "launcher", "examples/seeds/*"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
src = ["launcher/src", "examples/seeds/echo/src", "examples/seeds/echo_stream/src"]
# core/ is vendored verbatim (linted in the monorepo with its own ruff pin).
extend-exclude = ["*.md", "core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# core/ is excluded from linting (vendored), so ruff can't infer charms_core
# as first-party from `src` — declare the import layout explicitly.
[tool.ruff.lint.isort]
known-first-party = ["charms_core", "charms_launcher"]

[tool.mypy]
python_version = "3.12"
strict = true

# Optional heavy dependencies, lazy-imported behind try/except.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "huggingface_hub"]
ignore_missing_imports = true
