[project]
name = "charms-core"
version = "0.1.0"
description = "Charms shared contracts: nodes, seeds, recipes, chunks, wire protocol"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charms_core"]
