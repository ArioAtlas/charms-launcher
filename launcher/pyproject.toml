[project]
name = "charms-launcher"
version = "0.1.0"
description = "Run Charms seeds as Runes: the launcher CLI and the Rune Manager GUI"
requires-python = ">=3.12"
dependencies = [
    # Exact pin: the wire protocol must match the server release-for-release.
    "charms-core==0.1.0",
    "websockets>=14",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
charms-launcher = "charms_launcher.cli:main"
charms-rune-manager = "charms_launcher.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charms_launcher"]
