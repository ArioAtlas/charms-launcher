[project]
name = "charms-launcher"
version = "0.1.0"
description = "Run Charms seeds as Runes: the launcher CLI and the Rune Manager GUI"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "websockets>=14",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
charms-launcher = "charms_launcher.cli:main"
charms-rune-manager = "charms_launcher.gui:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "charms-seed-echo",
    "charms-seed-echo-stream",
]

# The demo seeds are dev-only path installs (used by the tests and handy for a
# first `charms-launcher run echo`). They are not part of the distribution.
[tool.uv.sources]
charms-seed-echo = { path = "examples/seeds/echo", editable = true }
charms-seed-echo-stream = { path = "examples/seeds/echo_stream", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One distribution ships both import packages: charms_launcher and its
# vendored copy of charms_core (the wire/SDK contracts, synced from the
# charms monorepo — see README "Protocol compatibility").
[tool.hatch.build.targets.wheel]
packages = ["src/charms_launcher", "src/charms_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
src = ["src"]
# src/charms_core is vendored verbatim from the charms monorepo (linted
# there, with its own ruff pin) — keep it byte-identical, don't lint it here.
extend-exclude = ["*.md", "src/charms_core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

# Optional heavy dependencies, lazy-imported behind try/except.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "huggingface_hub"]
ignore_missing_imports = true
